<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Physics AI | المحادثة
    </title>

    <link
        rel="stylesheet"
        href="chat.css"
    >

</head>


<body>


<header class="chat-topbar">

    <div class="chat-brand">

        <div class="chat-logo">
            ⚛️
        </div>

        <div>

            <strong>
                Physics AI
            </strong>

            <span>
                مدرس الفيزياء الذكي
            </span>

        </div>

    </div>


    <div class="top-actions">

        <span
            id="userName"
            class="user-name"
        >
        </span>

        <button
            id="logoutButton"
            class="logout-button"
        >
            خروج
        </button>

    </div>

</header>


<div class="chat-layout">


    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <button
            id="newChatButton"
            class="new-chat"
        >
            ＋ محادثة جديدة
        </button>


        <div class="sidebar-title">
            محادثاتك
        </div>


        <div
            id="conversationList"
            class="conversation-list"
        ></div>


        <a
            href="/study.html"
            class="study-link"
        >
            📚 المناهج والموسوعة
        </a>

    </aside>


    <!-- MAIN -->

    <main class="chat-main">


        <!-- LESSON INFO -->

        <div
            class="lesson-bar"
            id="lessonBar"
        >

            <div>

                <span
                    id="chatMode"
                    class="lesson-badge"
                >
                    Physics AI
                </span>

                <h2
                    id="lessonName"
                >
                    دردشة عامة
                </h2>

                <p
                    id="lessonDescription"
                >
                    اسأل Physics AI عن الفيزياء.
                </p>

            </div>

        </div>


        <!-- CHAT -->

        <div
            id="chat"
            class="chat"
        >

            <div class="welcome">

                <div class="welcome-icon">
                    ⚛️
                </div>

                <h1>
                    أهلًا بيك في Physics AI 👋
                </h1>

                <p>
                    اسألني، ابعت مسألة، صوّر السؤال،
                    أو سجل صوتك وأنا هساعدك.
                </p>

            </div>

        </div>


        <!-- IMAGE PREVIEW -->

        <div
            id="imagePreview"
            class="image-preview hidden"
        >

            <img
                id="previewImage"
                alt="الصورة"
            >

            <button
                id="removeImageButton"
                type="button"
            >
                ×
            </button>

        </div>


        <!-- INPUT -->

        <div class="input-wrapper">

            <div class="tools">

                <button
                    id="uploadButton"
                    class="tool-button"
                    title="رفع صورة"
                >
                    🖼️
                </button>


                <button
                    id="cameraButton"
                    class="tool-button"
                    title="الكاميرا"
                >
                    📷
                </button>


                <button
                    id="voiceButton"
                    class="tool-button"
                    title="تسجيل صوت"
                >
                    🎙️
                </button>


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                >


                <input
                    type="file"
                    id="cameraInput"
                    accept="image/*"
                    capture="environment"
                    hidden
                >

            </div>


            <textarea
                id="messageInput"
                rows="1"
                placeholder="اكتب سؤالك هنا..."
            ></textarea>


            <button
                id="sendButton"
                class="send-button"
            >
                ↑
            </button>

        </div>


        <div
            id="voiceStatus"
            class="voice-status"
        ></div>


        <div class="input-hint">

            Enter للإرسال
            <span>•</span>
            Shift + Enter لسطر جديد

        </div>

    </main>

</div>


<!-- CAMERA MODAL -->

<div
    id="cameraModal"
    class="modal hidden"
>

    <div class="modal-card">

        <div class="modal-header">

            <h3>
                تصوير المسألة
            </h3>

            <button
                id="closeCameraButton"
                type="button"
            >
                ×
            </button>

        </div>


        <video
            id="cameraVideo"
            autoplay
            playsinline
        ></video>


        <canvas
            id="cameraCanvas"
            hidden
        ></canvas>


        <button
            id="takePhotoButton"
            class="capture-button"
            type="button"
        >
            📷 التقاط الصورة
        </button>


        <p
            id="cameraError"
            class="camera-error"
        ></p>

    </div>

</div>


<script src="chat.js"></script>

</body>

</html>
